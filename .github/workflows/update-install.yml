name: install更新（手動・署名）

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: install-update-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-install:
    name: installをビルド・署名して更新
    runs-on: windows-2022
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      INSTALL_EXE: install/Nays2DH.exe
    steps:
      - name: リポジトリをデフォルトブランチから取得
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: make.batのコンパイラを検出
        id: detect-compiler
        shell: pwsh
        run: |
          $makePath = Join-Path $env:GITHUB_WORKSPACE 'make.bat'
          if (-not (Test-Path -LiteralPath $makePath -PathType Leaf)) {
            throw "make.batが見つかりません: $makePath"
          }

          $activeLines = foreach ($line in (Get-Content -LiteralPath $makePath)) {
            $trimmed = $line.Trim()
            if ([string]::IsNullOrWhiteSpace($trimmed)) {
              continue
            }
            if ($trimmed -match '^(?i:rem)(\s|$)' -or $trimmed.StartsWith('::')) {
              continue
            }
            $trimmed
          }
          $activeText = $activeLines -join "`n"
          $hasIfort = [regex]::IsMatch(
            $activeText,
            '(?i)(?<![A-Za-z0-9_])ifort(?:\.exe)?(?![A-Za-z0-9_])'
          )
          $hasIfx = [regex]::IsMatch(
            $activeText,
            '(?i)(?<![A-Za-z0-9_])ifx(?:\.exe)?(?![A-Za-z0-9_])'
          )

          if (($hasIfort -and $hasIfx) -or (-not $hasIfort -and -not $hasIfx)) {
            throw 'make.batからifortまたはifxを一意に検出できません。安全のためビルドを中止します。'
          }

          $compiler = if ($hasIfort) { 'ifort' } else { 'ifx' }
          "compiler=$compiler" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "DETECTED_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "make.batから検出したコンパイラ: $compiler"

      - name: Intel Fortran（ifort）環境を構築
        if: steps.detect-compiler.outputs.compiler == 'ifort'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel-classic
          version: "2021.10"

      - name: Intel Fortran（ifx）環境を構築
        if: steps.detect-compiler.outputs.compiler == 'ifx'
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: "2025.0"

      - name: Visual Studioのビルド環境を構築
        shell: pwsh
        run: |
          $vsWherePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vsWherePath -PathType Leaf)) {
            throw "vswhere.exeが見つかりません: $vsWherePath"
          }

          $installationPath = @(
            & $vsWherePath -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
          if (-not $installationPath) {
            throw 'C++ビルドツールを含むVisual Studioが見つかりません。'
          }

          $vsDevCmdPath = Join-Path $installationPath.Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmdPath -PathType Leaf)) {
            throw "VsDevCmd.batが見つかりません: $vsDevCmdPath"
          }

          $commandLine = '"{0}" -no_logo -arch=x64 -host_arch=x64 >nul && set' -f $vsDevCmdPath
          $environmentLines = & cmd.exe /d /c $commandLine
          if ($LASTEXITCODE -ne 0) {
            throw 'Visual Studioのビルド環境を初期化できませんでした。'
          }

          $exportNames = @(
            'INCLUDE', 'LIB', 'LIBPATH', 'PATH', 'VCINSTALLDIR',
            'VCToolsInstallDir', 'VisualStudioVersion', 'VSINSTALLDIR',
            'WindowsLibPath', 'WindowsSdkBinPath', 'WindowsSdkDir',
            'WindowsSDKLibVersion', 'WindowsSDKVersion'
          )
          foreach ($line in $environmentLines) {
            $separatorIndex = $line.IndexOf('=')
            if ($separatorIndex -le 0) {
              continue
            }
            $name = $line.Substring(0, $separatorIndex)
            if ($exportNames -notcontains $name) {
              continue
            }
            $value = $line.Substring($separatorIndex + 1)
            if ($name -ieq 'Path') {
              $name = 'PATH'
            }
            [Environment]::SetEnvironmentVariable($name, $value, 'Process')
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          if (-not (Get-Command link.exe -ErrorAction SilentlyContinue)) {
            throw 'Visual Studioのlink.exeをPATH上に設定できませんでした。'
          }
          if ([string]::IsNullOrWhiteSpace($env:LIB)) {
            throw 'Visual StudioのLIBが設定されていません。'
          }

      - name: ビルド前に既存の出力を削除
        shell: pwsh
        run: |
          $paths = @(
            (Join-Path $env:GITHUB_WORKSPACE 'Nays2DH.exe'),
            (Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_EXE)
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path -PathType Leaf) {
              Remove-Item -LiteralPath $path -Force
            }
          }
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -File -Include '*.obj', '*.mod' -ErrorAction SilentlyContinue |
            Remove-Item -Force

      - name: make.batでソルバーをビルド
        shell: pwsh
        run: |
          & cmd.exe /d /c 'call make.bat'
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "make.batの実行に失敗しました。終了コード: $exitCode"
          }

          $exePath = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_EXE
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "ビルド出力が見つかりません: $exePath"
          }
          if ((Get-Item -LiteralPath $exePath).Length -eq 0) {
            throw "ビルド出力が空です: $exePath"
          }
          Write-Host "ビルド出力: $exePath"

      - name: 署名Secretを検証
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $requiredNames = @(
            'AZURE_KEY_VAULT_URI',
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_CERT_NAME'
          )
          $missingNames = @(
            foreach ($name in $requiredNames) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                $name
              }
            }
          )
          if ($missingNames.Count -gt 0) {
            throw "未設定の署名Secretがあります: $($missingNames -join ', ')"
          }

          $keyVaultUri = $null
          if (-not [Uri]::TryCreate($env:AZURE_KEY_VAULT_URI, [UriKind]::Absolute, [ref] $keyVaultUri) -or
              $keyVaultUri.Scheme -ne 'https') {
            throw 'AZURE_KEY_VAULT_URIにはhttpsの絶対URLを指定してください。'
          }
          Write-Host '必須の署名Secretを確認しました。'

      - name: AzureSignToolをインストール
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'dotnet-tools'
          New-Item -ItemType Directory -Force -Path $toolPath | Out-Null
          dotnet tool install --tool-path $toolPath AzureSignTool --version 7.0.1
          $toolPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Nays2DH.exeに署名
        shell: pwsh
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CERT_NAME: ${{ secrets.AZURE_CERT_NAME }}
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_EXE
          & AzureSignTool sign `
            -kvu $env:AZURE_KEY_VAULT_URI `
            -kvi $env:AZURE_CLIENT_ID `
            -kvt $env:AZURE_TENANT_ID `
            -kvs $env:AZURE_CLIENT_SECRET `
            -kvc $env:AZURE_CERT_NAME `
            -tr 'http://timestamp.globalsign.com/tsa/advanced' `
            -td sha256 `
            -fd sha256 `
            -v `
            $exePath
          if ($LASTEXITCODE -ne 0) {
            throw "Nays2DH.exeの署名に失敗しました。終了コード: $LASTEXITCODE"
          }

      - name: 署名とタイムスタンプを検証
        id: verify-signature
        shell: pwsh
        env:
          AZURE_EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.AZURE_EXPECTED_SIGNER_THUMBPRINT }}
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE $env:INSTALL_EXE
          $signature = Get-AuthenticodeSignature -LiteralPath $exePath
          $failureReasons = @()
          $signerThumbprint = $null
          $timestampThumbprint = $null
          $signerSubject = $null
          $timestampSubject = $null

          if ($null -ne $signature.SignerCertificate) {
            $signerThumbprint = $signature.SignerCertificate.Thumbprint
            $signerSubject = $signature.SignerCertificate.Subject
          }
          if ($null -ne $signature.TimeStamperCertificate) {
            $timestampThumbprint = $signature.TimeStamperCertificate.Thumbprint
            $timestampSubject = $signature.TimeStamperCertificate.Subject
          }

          if ($signature.Status -ne 'Valid') {
            $failureReasons += "署名ステータスが$($signature.Status)です"
          }
          if (-not $signerThumbprint) {
            $failureReasons += '署名者証明書がありません'
          }
          if (-not $timestampThumbprint) {
            $failureReasons += 'タイムスタンプ証明書がありません'
          }

          $expectedThumbprint = ($env:AZURE_EXPECTED_SIGNER_THUMBPRINT -replace '\s', '').ToUpperInvariant()
          if ($expectedThumbprint) {
            $actualThumbprint = ($signerThumbprint -replace '\s', '').ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              $failureReasons += '署名者証明書のThumbprintが期待値と一致しません'
            }
          } else {
            Write-Warning 'AZURE_EXPECTED_SIGNER_THUMBPRINTが未登録のため、署名者Thumbprintの期待値比較はスキップします。'
          }

          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/signature-report.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $reportPath) | Out-Null
          [ordered]@{
            File = $exePath
            Status = [string]$signature.Status
            StatusMessage = [string]$signature.StatusMessage
            SignerSubject = $signerSubject
            SignerThumbprint = $signerThumbprint
            TimestampSubject = $timestampSubject
            TimestampThumbprint = $timestampThumbprint
            SHA256 = (Get-FileHash -LiteralPath $exePath -Algorithm SHA256).Hash
            Valid = ($failureReasons.Count -eq 0)
            FailureReasons = $failureReasons
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $reportPath -Encoding utf8

          if ($failureReasons.Count -gt 0) {
            throw "署名検証に失敗しました。$($failureReasons -join '; ')"
          }
          Write-Host '署名とタイムスタンプを検証しました。'

      - name: 署名検証レポートをArtifactに保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 署名検証レポート
          path: artifacts/signature-report.json
          if-no-files-found: warn

      - name: installだけをコミット
        id: commit
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- install

          $stagedFiles = @(git diff --cached --name-only)
          if ($stagedFiles.Count -eq 0) {
            'changed=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'installにコミット対象の変更はありません。'
            exit 0
          }

          $unexpectedFiles = @($stagedFiles | Where-Object { $_ -notmatch '^install/' })
          if ($unexpectedFiles.Count -gt 0) {
            throw "install以外のファイルがステージされています: $($unexpectedFiles -join ', ')"
          }

          git commit -m 'installを更新'
          if ($LASTEXITCODE -ne 0) {
            throw 'installのコミットに失敗しました。'
          }
          'changed=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: デフォルトブランチへ直接プッシュ
        id: direct-push
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $pushOutput = & git push origin "HEAD:refs/heads/$($env:DEFAULT_BRANCH)" 2>&1
          $pushExitCode = $LASTEXITCODE
          $pushOutput | ForEach-Object { Write-Host $_ }
          if ($pushExitCode -ne 0) {
            throw "デフォルトブランチへの直接プッシュに失敗しました。終了コード: $pushExitCode"
          }

      - name: 直接プッシュの反映状態を確認
        id: direct-push-check
        if: steps.commit.outputs.changed == 'true'
        shell: pwsh
        run: |
          git fetch origin $env:DEFAULT_BRANCH --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw 'デフォルトブランチの反映状態を確認できませんでした。'
          }

          $localCommit = (git rev-parse HEAD).Trim()
          $remoteCommit = (git rev-parse "origin/$($env:DEFAULT_BRANCH)").Trim()
          if ($localCommit -eq $remoteCommit) {
            'succeeded=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'デフォルトブランチへの反映を確認しました。'
          } else {
            'succeeded=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Warning '直接プッシュは完了していないため、更新ブランチへフォールバックします。'
          }

      - name: 更新ブランチへフォールバック
        id: fallback-branch
        if: steps.commit.outputs.changed == 'true' && steps.direct-push-check.outputs.succeeded != 'true'
        shell: pwsh
        run: |
          $branchName = "automation/install-update/$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          git switch --create $branchName
          if ($LASTEXITCODE -ne 0) {
            throw "更新ブランチを作成できませんでした: $branchName"
          }

          $pushOutput = & git push origin "HEAD:refs/heads/$branchName" 2>&1
          $pushExitCode = $LASTEXITCODE
          $pushOutput | ForEach-Object { Write-Host $_ }
          if ($pushExitCode -ne 0) {
            throw "更新ブランチへのプッシュに失敗しました。終了コード: $pushExitCode"
          }
          "FALLBACK_BRANCH=$branchName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Pull Requestを作成
        if: steps.commit.outputs.changed == 'true' && steps.direct-push-check.outputs.succeeded != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $title = "install更新（$($env:DETECTED_COMPILER)）"
          $body = @"
          ## 概要

          手動実行されたWorkflowで`install/Nays2DH.exe`をビルド・署名しました。

          - コンパイラ: `$($env:DETECTED_COMPILER)`
          - 署名検証: 成功
          - 直接プッシュ: ブランチ設定または権限によりフォールバック

          内容を確認してデフォルトブランチへマージしてください。マージ後は既存の`build.yml`が発火します。
          "@
          gh pr create `
            --repo $env:GITHUB_REPOSITORY `
            --base $env:DEFAULT_BRANCH `
            --head $env:FALLBACK_BRANCH `
            --title $title `
            --body $body
          if ($LASTEXITCODE -ne 0) {
            throw 'Pull Requestの作成に失敗しました。'
          }
